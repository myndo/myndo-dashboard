    <script>

        var dataSources = {
            get_data: function(a) { 
                return this.a;
            },
            get_dimension: function(a) {
                return ["Day", "Compaign"];
            },
            get_metric: function(a) {
                return ["Impression", "Cost"];
            },
            a : [
                [
                    "Day", "Compaign", "Impression", "Cost"
                ],
                [
                    "2025/01/01", "AAA", 10000, 12400
                ],
                [
                    "2025/01/01", "BBB", 5000, 3200
                ],
            ],
        }

        function graphDashboard(container, graphType, dataSources, page, dimension, metric) {
            this.container = container;
            this.graphType = graphType;
            this.dataSources = dataSources;
            this.page = page;
            this.current_dimension = dimension;
            this.current_metric = metric;
            this.dimensions = this.dataSources.get_dimension();
            this.metrics = this.dataSources.get_metric();
            this.init();
        }

        graphDashboard.prototype = {
            render: function(dimension, metric) {
                let title = this.chart.options.title.text;
                this.chart.destroy();
                this.current_dimension = dimension;
                this.current_metric = metric;
                this._create_doughnut(title);
            },
            init: function() {
                let _this = this;

                let edit_title = document.createElement('input');
                edit_title.type = "button";
                edit_title.value = "Edit title";
                document.querySelector('#contain_page').appendChild(edit_title);

                this.container_save = document.createElement('div');
                this.container_save.style.position = "relative";
                this.container_save.style.display = "none";
                document.querySelector('#contain_page').appendChild(this.container_save);

                this.input_save = document.createElement('input');
                this.input_save.type = "text";
                this.input_save.classList.add()
                this.container_save.appendChild(this.input_save);

                this.button_save = document.createElement('i');
                this.button_save.classList.add("bi", "bi-floppy");
                this.button_save.style.position = "absolute";
                this.button_save.style.right = "10px";
                this.button_save.style.top = "5px";
                this.button_save.style.zIndex = "999";
                this.container_save.appendChild(this.button_save);

                this.button_save.addEventListener('click', function() {
                    _this.chart.title.set("text", _this.input_save.value);
                    _this.container_save.style.display = "none";
                    edit_title.style.display = "block";
                })

                let contain_graph = document.createElement('div');
                contain_graph.id = this.container;
                contain_graph.style.width = "600px";
                contain_graph.style.height = "600px";
                document.querySelector('#contain_page').appendChild(contain_graph);

                let select_dimension = document.createElement('select');
                select_dimension.id = "aaaaa";
                document.querySelector('#contain_page').appendChild(select_dimension);
                
                let select_metric = document.createElement('select');
                select_dimension.id = "bbbbb";
                document.querySelector('#contain_page').appendChild(select_metric);

                for (let a of this.dimensions) {
                    select_dimension.innerHTML += "<option>" + a + "</option>";
                }

                for (let a of this.metrics) {
                    select_metric.innerHTML += "<option>" + a + "</option>";
                }

                select_dimension.addEventListener('change', function() {
                    _this.render(select_dimension.value, select_metric.value);
                })

                select_metric.addEventListener('change', function() {
                    _this.render(select_dimension.value, select_metric.value);
                })

                edit_title.addEventListener('click', function() {
                    _this.chart.title.set("text", "");
                    _this.container_save.style.display = "block";
                    edit_title.style.display = "none";
                })

                if (this.graphType == "doughnut") {
                    return this._create_doughnut("Channel Mix");
                } 
                if (this.graphType == "linee") {
                    return this._create_graph();
                }
                if (this.graphType == "table") {
                    return this._create_table();
                }
            },
            _create_doughnut: function(title_name) {
                let data = this.dataSources.get_data();
                this.chart = new CanvasJS.Chart(this.container, {
                    animationEnabled: true,
                    title: {
                        text: title_name,
                        horizontalAlign: "left"
                    },
                    data: [{
                        type: this.graphType,
                        startAngle: 60,
                        indexLabelFontSize: 17,
                        indexLabel: "{label} - #percent%",
                        toolTipContent: "<b>{label}:</b> {y} (#percent%)",
                        dataPoints: this._convert_data(this.current_dimension, this.current_metric, data)
                    }]
                });

                this.chart.render();
            },
            _convert_data: function(dimension, metric, data) {
                this.dataSources.get_data();
                let dimension_idx = data[0].indexOf(dimension);
                let metric_idx = data[0].indexOf(metric);
                let a = [];
                for (let i = 1; i < data.length; i++) {
                    a.push(
                        {
                            y: data[i][metric_idx],
                            label: data[i][dimension_idx],
                            color: "#07c8c0",
                        }
                    )
                }
                return a;
            },
            _create_graph: function() {
                let data = this.dataSources.get_data();
                let normalData = this._convert_data(this.current_dimension, this.current_metric, data);

                let _this = this;

                function toggleDataSeries(e){
                    if (typeof(e.dataSeries.visible) === "undefined" || !e.dataSeries.visible) {
                        e.dataSeries.visible = true;
                    } else if (e.dataSeries.type == "column") {
                        e.dataSeries.type = "area";
                    } else if (e.dataSeries.type == "area") {
                        e.dataSeries.type = "line";
                    } else if (e.dataSeries.type == "line") {
                        e.dataSeries.type = "column";
                    } else{
                        e.dataSeries.visible = false;
                    }
                    _this.chart.render();
                    
                }

                this.chart = new CanvasJS.Chart("aaa", {
                    animationEnabled: true,
                    theme: "light2",
                    title: {
                        text: "Trend by result"
                    },
                    axisX: {
                        valueFormatString: "MMM",
                        title: "Time",
                        interval: 1,
                        intervalType: "month",
                        crosshair: {
                            enabled: true,
                            snapToDataPoint: true
                        }
                    },
                    axisY: {
                        title: "Percentage",
                        includeZero: true,
                        crosshair: {
                            enabled: true
                        }
                    },
                    toolTip: {
                        shared: true
                    },
                    legend: {
                        cursor: "pointer",
                        verticalAlign: "bottom",
                        horizontalAlign: "left",
                        itemclick: toggleDataSeries
                    },
                    data: [
                        {
                            type: "column",
                            showInLegend: true,
                            name: "Media",
                            markerType: "square",
                            lineColor: "rgb(8 182 174)",
                            markerColor: "rgb(8 182 174)",
                            xValueFormatString: "DD MMM, YYYY",
                            color: "#F08080",
                            dataPoints: normalData
                        },
                        {
                            type: "line",
                            showInLegend: true,
                            name: "Azienda B",
                            lineColor: "rgb(60 106 113)",
                            markerColor: "rgb(60 106 113)",
                            dataPoints: normalData
                        }
                    ]
                });
                this.chart.render();
            },
            _create_table: function() {
                let data = this.dataSources.get_data();
                let normalData = this._convert_data(this.current_dimension, this.current_metric, data);
                console.log(normalData)
                let table = new DataTable('#ccc', {
                    paging: true,
                    pageLength: 10,
                    order: [[0, "asc"]],
                    select: true,
                    data: normalData,
                    columns: [
                        { data: "Day", title: "Day" },
                        { data: "Compaign", title: "Compaign" },
                        { data: "Impression", title: "Impression" },
                        { data: "Cost", title: "Cost" }
                    ]
                });
            }
        }
        var chart = new graphDashboard('aaa', "doughnut", dataSources, null, "Compaign", "Impression");
        var chart_due = new graphDashboard('bbb', "doughnut", dataSources, null, "Compaign", "Impression");
        var chart_tre = new graphDashboard('ccc', "doughnut", dataSources, null, "Compaign", "Impression");
        var chart_qua = new graphDashboard('eee', "doughnut", dataSources, null, "Compaign", "Impression");
        var chart_cin = new graphDashboard('fff', "doughnut", dataSources, null, "Compaign", "Impression");
        var chart_sei = new graphDashboard('ggg', "doughnut", dataSources, null, "Compaign", "Impression");
    </script>
